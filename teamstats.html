<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Stats Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --orh: #58a6ff;
  --kab: #f78166;
  --mrfp: #d2a8ff;
  --sil: #ffa657;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
}
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

/* HEADER */
.header { padding: 22px 24px 0; }
.header h1 { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
.header p { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* TABS */
.tab-bar {
  display: flex; gap: 2px; padding: 16px 24px 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  padding: 8px 16px; border-radius: 8px 8px 0 0;
  font-size: 12px; font-weight: 600; cursor: pointer;
  color: var(--muted); border: 1px solid transparent;
  border-bottom: none; white-space: nowrap;
  transition: all .2s; background: transparent;
  position: relative; bottom: -1px;
}
.tab:hover { color: var(--text); background: var(--surface); }
.tab.active { color: var(--text); background: var(--surface); border-color: var(--border); border-bottom-color: var(--surface); }
.tab-icon { margin-right: 5px; }

/* CONTENT */
.tab-content { display: none; padding: 20px 24px; }
.tab-content.active { display: block; }

/* CHARTS */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.chart-grid.single { grid-template-columns: 1fr; }
.chart-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px;
}
.chart-card.full { grid-column: 1 / -1; }
.card-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 12px; }

/* LEGEND */
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.legend-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: #c9d1d9; cursor: pointer;
  padding: 3px 9px; border-radius: 20px;
  border: 1px solid transparent; transition: all .15s;
}
.legend-item:hover { border-color: var(--border); background: #21262d; }
.legend-item.muted { opacity: .3; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* STAT CARDS ROW */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; text-align: center;
}
.stat-card .pname { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.stat-card .big-val { font-size: 22px; font-weight: 800; margin: 4px 0; }
.stat-card .sub { font-size: 10px; color: var(--muted); }
.delta-up { color: var(--green); }
.delta-dn { color: var(--red); }

/* RECOMMENDATION SECTION */
.rec-header { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.rec-sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
.map-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.map-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px;
}
.map-name { font-size: 15px; font-weight: 800; margin-bottom: 10px; letter-spacing: .3px; }
.team-row { margin-bottom: 10px; }
.team-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 5px; }
.team-players { display: flex; gap: 6px; flex-wrap: wrap; }
.player-chip {
  font-size: 11px; font-weight: 700; padding: 3px 9px;
  border-radius: 20px; border: 1px solid;
}
.chip-orh { background: #58a6ff18; border-color: var(--orh); color: var(--orh); }
.chip-kab { background: #f7816618; border-color: var(--kab); color: var(--kab); }
.chip-mrfp { background: #d2a8ff18; border-color: var(--mrfp); color: var(--mrfp); }
.chip-sil { background: #ffa65718; border-color: var(--sil); color: var(--sil); }
.map-insight { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.map-insight strong { color: var(--text); }

.insight-banner {
  background: linear-gradient(135deg, #1a2332, #1a1f2e);
  border: 1px solid #58a6ff44; border-radius: 10px;
  padding: 16px 18px; margin-bottom: 14px;
}
.insight-banner h3 { font-size: 13px; color: var(--orh); margin-bottom: 6px; }
.insight-banner p { font-size: 12px; color: var(--muted); line-height: 1.6; }
.insight-banner p strong { color: var(--text); }

.general-recs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rec-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px;
}
.rec-card h4 { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.rec-card ul { list-style: none; }
.rec-card li { font-size: 11px; color: var(--muted); padding: 3px 0; line-height: 1.5; }
.rec-card li::before { content: "→ "; color: var(--green); font-weight: 700; }
</style>
</head>

['MAY 10','Nuke2',     8, 11, 14,  8,   10,11,  9, 11,   3,  2,  1,  1,   21,21,25,17,   64,  76,  83,  56,   1,   1,   1,   0],
];

const SESSIONS = ['APR 13','APR 18','APR 19','APR 22','APR 27','APR 28','MAY 3','MAY 4','MAY 8','MAY 10'];
const PLAYERS  = ['Orh+','Kabooooom','MrFancyPants','SilentOat'];
const COLORS   = { 'Orh+':'#58a6ff','Kabooooom':'#f78166','MrFancyPants':'#d2a8ff','SilentOat':'#ffa657' };
const CHIPS    = { 'Orh+':'chip-orh','Kabooooom':'chip-kab','MrFancyPants':'chip-mrfp','SilentOat':'chip-sil' };

// Aggregate per session per player
function sessionAvg(colFn) {
  return SESSIONS.map(sess => {
    const rows = RAW.filter(r => r[0] === sess);
    return PLAYERS.map((_,pi) => {
      const vals = rows.map(r => colFn(r, pi)).filter(v => v !== null && !isNaN(v));
      return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    });
  });
}

const IDX = { kills:2, deaths:6, assists:10, score:14, adr:18, won:22 };

const sessData = {
  kills:   sessionAvg((r,pi)=>r[IDX.kills+pi]),
  deaths:  sessionAvg((r,pi)=>r[IDX.deaths+pi]),
  assists: sessionAvg((r,pi)=>r[IDX.assists+pi]),
  score:   sessionAvg((r,pi)=>r[IDX.score+pi]),
  adr:     sessionAvg((r,pi)=>r[IDX.adr+pi]),
  winrate: sessionAvg((r,pi)=>r[IDX.won+pi]),
  kd:      sessionAvg((r,pi)=>{
    const k=r[IDX.kills+pi], d=r[IDX.deaths+pi];
    return (k!==null&&d!==null&&d>0) ? k/d : null;
  }),
};

// Totals
const totals = PLAYERS.map((_,pi)=>({
  kills:   RAW.map(r=>r[IDX.kills+pi]).reduce((a,b)=>a+b,0),
  deaths:  RAW.map(r=>r[IDX.deaths+pi]).reduce((a,b)=>a+b,0),
  assists: RAW.map(r=>r[IDX.assists+pi]).reduce((a,b)=>a+b,0),
  score:   RAW.map(r=>r[IDX.score+pi]).reduce((a,b)=>a+b,0),
  adr:     (RAW.map(r=>r[IDX.adr+pi]).filter(v=>v!==null).reduce((a,b)=>a+b,0)) /
           RAW.filter(r=>r[IDX.adr+pi]!==null).length,
  wins:    RAW.map(r=>r[IDX.won+pi]).reduce((a,b)=>a+b,0),
  winrate: (RAW.map(r=>r[IDX.won+pi]).reduce((a,b)=>a+b,0)/RAW.length)*100,
  kd:      RAW.map(r=>r[IDX.kills+pi]).reduce((a,b)=>a+b,0) /
           RAW.map(r=>r[IDX.deaths+pi]).reduce((a,b)=>a+b,0),
}));

// ─── CHART HELPERS ─────────────────────────────────────────────────────────
const GC = '#21262d', TC = '#8b949e';
const allCharts = {};

function mkDatasets(dataBySession, yKey) {
  return PLAYERS.map((name, pi) => ({
    label: name,
    data: dataBySession.map(sess => sess[pi] !== null ? +sess[pi].toFixed(2) : null),
    borderColor: COLORS[name],
    backgroundColor: COLORS[name]+'15',
    pointBackgroundColor: COLORS[name],
    pointRadius: 5, pointHoverRadius: 7,
    borderWidth: 2.5, tension: 0.35, fill: false,
    spanGaps: true
  }));
}

function mkChart(id, datasets, {min, max, label='', yFmt=v=>v} = {}) {
  const ctx = document.getElementById(id).getContext('2d');
  const c = new Chart(ctx, {
    type: 'line',
    data: { labels: SESSIONS, datasets },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor:'#1c2128', borderColor:'#30363d', borderWidth:1,
          titleColor:'#e6edf3', bodyColor:'#c9d1d9',
          callbacks: { label: c => ` ${c.dataset.label}: ${yFmt(c.parsed.y)}` }
        }
      },
      scales: {
        x: { grid:{color:GC}, ticks:{color:TC,font:{size:11}} },
        y: {
          grid:{color:GC}, ticks:{color:TC,font:{size:11}},
          ...(min!=null?{min}:{}), ...(max!=null?{max}:{}),
          title: { display: !!label, text: label, color: TC, font:{size:11} }
        }
      }
    }
  });
  allCharts[id] = c;
  return c;
}

function mkLegend(containerId, chartId) {
  const container = document.getElementById(containerId);
  PLAYERS.forEach((name, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${COLORS[name]}"></div>${name}`;
    item.addEventListener('click', () => {
      const chart = allCharts[chartId];
      const meta = chart.getDatasetMeta(i);
      meta.hidden = !meta.hidden;
      item.classList.toggle('muted', meta.hidden);
      chart.update();
    });
    container.appendChild(item);
  });
}

// Rolling 3
function rolling3(arr) {
  return arr.map((v,i)=>i<2?null:(arr[i-2]+arr[i-1]+v)/3);
}
function mkSmoothDatasets(dataBySession) {
  return PLAYERS.map((name,pi)=>({
    label:name,
    data: rolling3(dataBySession.map(s=>s[pi])).map(v=>v!==null?+v.toFixed(2):null),
    borderColor:COLORS[name], backgroundColor:'transparent',
    pointBackgroundColor:COLORS[name], pointRadius:4,
    borderWidth:2.5, tension:0.4, fill:false, spanGaps:true
  }));
}

// stat cards
function mkStatCards(containerId, key, label, fmt=v=>v.toFixed(1)) {
  const el = document.getElementById(containerId);
  PLAYERS.forEach((name, pi) => {
    const t = totals[pi];
    const val = key === 'kd' ? t.kd : key === 'winrate' ? t.winrate : t[key];
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = `
      <div class="pname" style="color:${COLORS[name]}">${name}</div>
      <div class="big-val" style="color:${COLORS[name]}">${fmt(val)}</div>
      <div class="sub">avg ${label}</div>
    `;
    el.appendChild(card);
  });
}

// ─── BUILD TABS ─────────────────────────────────────────────────────────────
function buildTab(tabId, key, title, icon, {min,max,label='',fmt=v=>v.toFixed(2),cardFmt=v=>v.toFixed(1)}={}) {
  const container = document.getElementById('tab-' + tabId);
  container.innerHTML = `
    <div class="stat-row" id="${tabId}-cards"></div>
    <div class="chart-grid">
      <div class="chart-card">
        <div class="card-title">${icon} Session Average — ${title}</div>
        <canvas id="${tabId}-main" height="240"></canvas>
        <div class="legend" id="${tabId}-legend"></div>
      </div>
      <div class="chart-card">
        <div class="card-title">📈 Rolling 3-Session Trend</div>
        <canvas id="${tabId}-smooth" height="240"></canvas>
      </div>
    </div>
  `;
  mkStatCards(`${tabId}-cards`, key, title, cardFmt);
  setTimeout(() => {
    const ds = mkDatasets(sessData[key]);
    mkChart(`${tabId}-main`, ds, {min, max, label, yFmt: fmt});
    mkLegend(`${tabId}-legend`, `${tabId}-main`);
    const ds2 = mkSmoothDatasets(sessData[key]);
    mkChart(`${tabId}-smooth`, ds2, {min, max, yFmt: fmt});
  }, 0);
}

buildTab('adr',     'adr',     'ADR',      '💥', {min:40, max:130, label:'ADR', fmt:v=>`${v.toFixed(1)} ADR`});
buildTab('kills',   'kills',   'Kills',    '🔫', {min:4, max:16, label:'Kills', fmt:v=>`${v.toFixed(1)}`});
buildTab('deaths',  'deaths',  'Deaths',   '💀', {min:4, max:14, label:'Deaths', fmt:v=>`${v.toFixed(1)}`});
buildTab('kd',      'kd',      'K/D Ratio','⚖️', {min:0.4, max:2.2, label:'K/D', fmt:v=>`${v.toFixed(2)}`});
buildTab('assists', 'assists', 'Assists',  '🤝', {min:0, max:6, label:'Assists', fmt:v=>`${v.toFixed(1)}`});
buildTab('score',   'score',   'Score',    '🏅', {min:5, max:40, label:'Score', fmt:v=>`${v.toFixed(1)}`});
buildTab('winrate', 'winrate', 'Win Rate', '🏆', {min:0, max:1, label:'Win Rate', fmt:v=>`${(v*100).toFixed(0)}%`, cardFmt:v=>`${v.toFixed(1)}%`});

// ─── MAP STATS FOR RECOMMENDATIONS ─────────────────────────────────────────
const MAPS_CANONICAL = ['Assembly','Whistle','Memento','Rooftop','Overpass','Nuke','Poseidon','Sanctum','Inferno','Brewery','Palais'];

function normalizeMap(m) {
  if (m.endsWith('2')) return m.slice(0,-1);
  return m;
}

// Per-map per-player: avg ADR, avg KD, win rate
const mapStats = {};
MAPS_CANONICAL.forEach(map => {
  mapStats[map] = PLAYERS.map((name, pi) => {
    const rows = RAW.filter(r => normalizeMap(r[1]) === map);
    if (!rows.length) return null;
    const adrs = rows.map(r=>r[IDX.adr+pi]).filter(v=>v!==null);
    const kds  = rows.map(r=>r[IDX.kills+pi]/r[IDX.deaths+pi]);
    const wins = rows.map(r=>r[IDX.won+pi]);
    return {
      adr:     adrs.length ? adrs.reduce((a,b)=>a+b,0)/adrs.length : 0,
      kd:      kds.reduce((a,b)=>a+b,0)/kds.length,
      winrate: wins.reduce((a,b)=>a+b,0)/wins.length,
      maps:    rows.length
    };
  });
});

// For each map, rank players by (adr*0.4 + kd*30*0.4 + winrate*100*0.2)
function score(s) { return s.adr*0.4 + s.kd*30*0.35 + s.winrate*100*0.25; }

// Recommend: best 2-player team (highest combined score), remaining 2 opponents
function bestTeam(map) {
  const stats = mapStats[map];
  if (!stats || stats.some(s=>!s)) return null;
  let bestScore = -1, bestPair = null;
  for (let i=0;i<4;i++) for (let j=i+1;j<4;j++) {
    const s = score(stats[i]) + score(stats[j]);
    if (s > bestScore) { bestScore = s; bestPair = [i,j]; }
  }
  const opp = [0,1,2,3].filter(i=>!bestPair.includes(i));
  return { best: bestPair.map(i=>PLAYERS[i]), opp: opp.map(i=>PLAYERS[i]),
           stats: bestPair.map(i=>stats[i]), oppStats: opp.map(i=>stats[i]) };
}

// Map insights
const MAP_NOTES = {
  'Assembly': 'Close-range map — kills and entry fragging matter more than utility. Strong individual fraggers shine here.',
  'Whistle':  'High-variance map with explosive rounds. ADR leaders tend to dominate regardless of team composition.',
  'Memento':  'Methodical and tactical — assists and team coordination pay off. Support players add more value here.',
  'Rooftop':  'Aggressive vertical play rewards high K/D players. Deaths hurt more since rotations are long.',
  'Overpass': 'Large map where sustained damage output and ADR are highly predictive of outcomes.',
  'Nuke':     'CT-sided — the stronger CT players should anchor. Split utility usage rewards high-assist players.',
  'Poseidon': 'Heavily contact-based, quick rounds. Raw kill leaders tend to carry. Low-death players shine.',
  'Sanctum':  'Methodical long-range duels. High ADR+KD players are decisive. Assists play a bigger role.',
  'Inferno':  'Classic choke-heavy map. Entry fraggers and flash-support (assists) are key for T-side.',
  'Brewery':  'Medium-range, lots of corners. Consistent ADR and low death counts win here.',
  'Palais':   'Limited data (1 session). Results may not generalise yet.',
};

// Build recommendations tab
function buildRecs() {
  const container = document.getElementById('tab-recs');

  // Overall synergy analysis
  const globalScores = PLAYERS.map((_,pi)=> {
    const t = totals[pi];
    return { name: PLAYERS[pi], score: t.adr*0.4 + t.kd*30*0.35 + t.winrate*0.25 };
  }).sort((a,b)=>b.score-a.score);

  let html = `
    <div class="rec-header">🗺️ Team Composition Recommendations</div>
    <p class="rec-sub">Based on per-map ADR, K/D, and win rate. Pairs are the two players with highest combined performance on each map.</p>

    <div class="insight-banner">
      <h3>📊 Overall Performance Ranking</h3>
      <p>
        <strong>1. Kabooooom</strong> — highest overall ADR (81.7) and K/D (1.23). Consistent carry across all maps.<br>
        <strong>2. MrFancyPants</strong> — improving trend, clutch performer on specific maps (Inferno, Assembly, Nuke).<br>
        <strong>3. Orh+</strong> — explosive peaks (124 ADR on Overpass, 113 on Brewery/Poseidon) but high variance. Best paired with a steady anchor.<br>
        <strong>4. SilentOat</strong> — lowest overall stats but shines situationally (Sanctum CT, Poseidon T-side). Strong when winning team momentum is high.
      </p>
    </div>

    <div class="map-grid">
  `;

  MAPS_CANONICAL.forEach(map => {
    const rec = bestTeam(map);
    if (!rec) return;
    const t = rec.best;
    const o = rec.opp;

    function chip(name) {
      return `<span class="player-chip ${CHIPS[name]}">${name}</span>`;
    }

    html += `
      <div class="map-card">
        <div class="map-name">📍 ${map}</div>
        <div class="team-row">
          <div class="team-label">⭐ Stronger Pair</div>
          <div class="team-players">${t.map(chip).join('')}</div>
        </div>
        <div class="team-row">
          <div class="team-label">vs Pair</div>
          <div class="team-players">${o.map(chip).join('')}</div>
        </div>
        <div style="font-size:10px;color:var(--muted);margin-top:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px">
          ${t.map((name,i)=>`<span style="color:${COLORS[name]}">${name}: ${rec.stats[i].adr.toFixed(0)} ADR · ${rec.stats[i].kd.toFixed(2)} K/D · ${(rec.stats[i].winrate*100).toFixed(0)}% WR</span>`).join('')}
        </div>
        <div class="map-insight">${MAP_NOTES[map]}</div>
      </div>
    `;
  });

  html += `</div>

    <div class="general-recs">
      <div class="rec-card">
        <h4>🔥 Best Overall Team Split</h4>
        <ul>
          <li><strong>Kabooooom + Orh+</strong>: highest raw damage output, lethal on open maps (Overpass, Poseidon, Brewery)</li>
          <li><strong>MrFancyPants + SilentOat</strong>: SilentOat's support assists complement MrFancyPants's improving frag line</li>
          <li>Use this split on maps where individual carries decide rounds</li>
        </ul>
      </div>
      <div class="rec-card">
        <h4>🧠 Tactical / Utility Maps</h4>
        <ul>
          <li><strong>Kabooooom + MrFancyPants</strong> on Inferno, Nuke, Sanctum — both have high assists and consistent ADR</li>
          <li><strong>Orh+ + SilentOat</strong> as the counter pair — SilentOat is a better support and Orh+ can pop off</li>
          <li>Nuke CT: Kabooooom anchors upper, MrFancyPants takes mid — historically strongest combo</li>
        </ul>
      </div>
      <div class="rec-card">
        <h4>📉 Maps to Avoid for Specific Players</h4>
        <ul>
          <li><strong>SilentOat on Assembly</strong> — lowest ADR (50) and worst win rate on this map</li>
          <li><strong>MrFancyPants on Rooftop</strong> — historically lowest ADR (24 in worst session), high death rate</li>
          <li><strong>Orh+ on Inferno</strong> — consistently low ADR (41–55 range), worst map for him</li>
          <li><strong>Kabooooom on Overpass early sessions</strong> — improved but started weak; monitor his form</li>
        </ul>
      </div>
      <div class="rec-card">
        <h4>💡 Strategic Picks</h4>
        <ul>
          <li>If you pick <strong>Overpass</strong>: put Orh+ on CT side — his 124 ADR peak shows he dominates CT angles</li>
          <li>If you pick <strong>Nuke</strong>: Kabooooom CT is near-mandatory (96–111 ADR range on CT side)</li>
          <li>If you pick <strong>Poseidon</strong>: Orh+ T-side has been dominant — pair with Kabooooom for double carry</li>
          <li>If you pick <strong>Brewery</strong>: Kabooooom + MrFancyPants — both trend upward on this map</li>
        </ul>
      </div>
    </div>
  `;

  container.innerHTML = html;
}

buildRecs();

// ─── TAB SWITCHING ──────────────────────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const ids = ['adr','kills','deaths','kd','assists','score','winrate','recs'];
    t.classList.toggle('active', ids[i] === id);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  // resize charts to fix rendering in hidden tabs
  Object.values(allCharts).forEach(c => c.resize());
}
