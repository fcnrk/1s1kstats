<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Stats Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --orh: #58a6ff;
  --kab: #f78166;
  --mrfp: #d2a8ff;
  --sil: #ffa657;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
}
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

/* HEADER */
.header { padding: 22px 24px 0; }
.header h1 { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
.header p { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* TABS */
.tab-bar {
  display: flex; gap: 2px; padding: 16px 24px 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  padding: 8px 16px; border-radius: 8px 8px 0 0;
  font-size: 12px; font-weight: 600; cursor: pointer;
  color: var(--muted); border: 1px solid transparent;
  border-bottom: none; white-space: nowrap;
  transition: all .2s; background: transparent;
  position: relative; bottom: -1px;
}
.tab:hover { color: var(--text); background: var(--surface); }
.tab.active { color: var(--text); background: var(--surface); border-color: var(--border); border-bottom-color: var(--surface); }
.tab-icon { margin-right: 5px; }

/* CONTENT */
.tab-content { display: none; padding: 20px 24px; }
.tab-content.active { display: block; }

/* CHARTS */
.chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.chart-grid.single { grid-template-columns: 1fr; }
.chart-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px;
}
.chart-card.full { grid-column: 1 / -1; }
.card-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 12px; }

/* LEGEND */
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.legend-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: #c9d1d9; cursor: pointer;
  padding: 3px 9px; border-radius: 20px;
  border: 1px solid transparent; transition: all .15s;
}
.legend-item:hover { border-color: var(--border); background: #21262d; }
.legend-item.muted { opacity: .3; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

/* STAT CARDS ROW */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; text-align: center;
}
.stat-card .pname { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.stat-card .big-val { font-size: 22px; font-weight: 800; margin: 4px 0; }
.stat-card .sub { font-size: 10px; color: var(--muted); }
.delta-up { color: var(--green); }
.delta-dn { color: var(--red); }

/* RECOMMENDATION SECTION */
.rec-header { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.rec-sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
.map-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.map-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px;
}
.map-name { font-size: 15px; font-weight: 800; margin-bottom: 10px; letter-spacing: .3px; }
.team-row { margin-bottom: 10px; }
.team-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 5px; }
.team-players { display: flex; gap: 6px; flex-wrap: wrap; }
.player-chip {
  font-size: 11px; font-weight: 700; padding: 3px 9px;
  border-radius: 20px; border: 1px solid;
}
.chip-orh { background: #58a6ff18; border-color: var(--orh); color: var(--orh); }
.chip-kab { background: #f7816618; border-color: var(--kab); color: var(--kab); }
.chip-mrfp { background: #d2a8ff18; border-color: var(--mrfp); color: var(--mrfp); }
.chip-sil { background: #ffa65718; border-color: var(--sil); color: var(--sil); }
.map-insight { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.map-insight strong { color: var(--text); }

.insight-banner {
  background: linear-gradient(135deg, #1a2332, #1a1f2e);
  border: 1px solid #58a6ff44; border-radius: 10px;
  padding: 16px 18px; margin-bottom: 14px;
}
.insight-banner h3 { font-size: 13px; color: var(--orh); margin-bottom: 6px; }
.insight-banner p { font-size: 12px; color: var(--muted); line-height: 1.6; }
.insight-banner p strong { color: var(--text); }

.general-recs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rec-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px;
}
.rec-card h4 { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.rec-card ul { list-style: none; }
.rec-card li { font-size: 11px; color: var(--muted); padding: 3px 0; line-height: 1.5; }
.rec-card li::before { content: "→ "; color: var(--green); font-weight: 700; }

/* H2H MATRIX */
.h2h-table { width:100%; border-collapse:collapse; font-size:12px; }
.h2h-table th, .h2h-table td { border:1px solid var(--border); padding:10px 8px; text-align:center; }
.h2h-table th { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
.h2h-pct { font-size:15px; font-weight:800; }
.h2h-rec { font-size:10px; color:var(--muted); margin-top:2px; }
</style>
</head>

// Aggregate per session per player
function sessionAvg(colFn) {
  return SESSIONS.map(sess => {
    const rows = RAW.filter(r => r[0] === sess);
    return PLAYERS.map((_,pi) => {
      const vals = rows.map(r => colFn(r, pi)).filter(v => v !== null && !isNaN(v));
      return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    });
  });
}

  kills:   sessionAvg((r,pi)=>r[IDX.kills+pi]),
  deaths:  sessionAvg((r,pi)=>r[IDX.deaths+pi]),
  assists: sessionAvg((r,pi)=>r[IDX.assists+pi]),
  score:   sessionAvg((r,pi)=>r[IDX.score+pi]),
  adr:     sessionAvg((r,pi)=>r[IDX.adr+pi]),
  winrate: sessionAvg((r,pi)=>r[IDX.won+pi]),
  kd:      sessionAvg((r,pi)=>{
    const k=r[IDX.kills+pi], d=r[IDX.deaths+pi];
    return (k!==null&&d!==null&&d>0) ? k/d : null;
  }),
};

// ─── CHART HELPERS ─────────────────────────────────────────────────────────
const GC = '#21262d', TC = '#8b949e';
const allCharts = {};

function mkDatasets(dataBySession, yKey) {
  return PLAYERS.map((name, pi) => ({
    label: name,
    data: dataBySession.map(sess => sess[pi] !== null ? +sess[pi].toFixed(2) : null),
    borderColor: COLORS[name],
    backgroundColor: COLORS[name]+'15',
    pointBackgroundColor: COLORS[name],
    pointRadius: 5, pointHoverRadius: 7,
    borderWidth: 2.5, tension: 0.35, fill: false,
    spanGaps: true
  }));
}

function mkChart(id, datasets, {min, max, label='', yFmt=v=>v} = {}) {
  const ctx = document.getElementById(id).getContext('2d');
  const c = new Chart(ctx, {
    type: 'line',
    data: { labels: SESSIONS, datasets },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor:'#1c2128', borderColor:'#30363d', borderWidth:1,
          titleColor:'#e6edf3', bodyColor:'#c9d1d9',
          callbacks: { label: c => ` ${c.dataset.label}: ${yFmt(c.parsed.y)}` }
        }
      },
      scales: {
        x: { grid:{color:GC}, ticks:{color:TC,font:{size:11}} },
        y: {
          grid:{color:GC}, ticks:{color:TC,font:{size:11}},
          ...(min!=null?{min}:{}), ...(max!=null?{max}:{}),
          title: { display: !!label, text: label, color: TC, font:{size:11} }
        }
      }
    }
  });
  allCharts[id] = c;
  return c;
}

function mkLegend(containerId, chartId) {
  const container = document.getElementById(containerId);
  PLAYERS.forEach((name, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${COLORS[name]}"></div>${name}`;
    item.addEventListener('click', () => {
      const chart = allCharts[chartId];
      const meta = chart.getDatasetMeta(i);
      meta.hidden = !meta.hidden;
      item.classList.toggle('muted', meta.hidden);
      chart.update();
    });
    container.appendChild(item);
  });
}

// Rolling 3
function rolling3(arr) {
  return arr.map((v,i)=>i<2?null:(arr[i-2]+arr[i-1]+v)/3);
}
function mkSmoothDatasets(dataBySession) {
  return PLAYERS.map((name,pi)=>({
    label:name,
    data: rolling3(dataBySession.map(s=>s[pi])).map(v=>v!==null?+v.toFixed(2):null),
    borderColor:COLORS[name], backgroundColor:'transparent',
    pointBackgroundColor:COLORS[name], pointRadius:4,
    borderWidth:2.5, tension:0.4, fill:false, spanGaps:true
  }));
}

// stat cards
function mkStatCards(containerId, key, label, fmt=v=>v.toFixed(1)) {
  const el = document.getElementById(containerId);
  PLAYERS.forEach((name, pi) => {
    const t = totals[pi];
    const val = key === 'kd' ? t.kd : key === 'winrate' ? t.winrate : t[key];
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = `
      <div class="pname" style="color:${COLORS[name]}">${name}</div>
      <div class="big-val" style="color:${COLORS[name]}">${fmt(val)}</div>
      <div class="sub">avg ${label}</div>
    `;
    el.appendChild(card);
  });
}

  mkStatCards(`${tabId}-cards`, key, title, cardFmt);

}

// ─── MAP STATS FOR RECOMMENDATIONS ─────────────────────────────────────────
const MAPS_CANONICAL = ['Assembly','Whistle','Memento','Rooftop','Overpass','Nuke','Poseidon','Sanctum','Inferno','Brewery','Palais'];

function normalizeMap(m) {
  if (m.endsWith('2')) return m.slice(0,-1);
  return m;
}

// Per-map per-player: avg ADR, avg KD, win rate
const mapStats = {};
MAPS_CANONICAL.forEach(map => {
  mapStats[map] = PLAYERS.map((name, pi) => {
    const rows = RAW.filter(r => normalizeMap(r[1]) === map);
    if (!rows.length) return null;
    const adrs = rows.map(r=>r[IDX.adr+pi]).filter(v=>v!==null);
    const kds  = rows.map(r=>r[IDX.kills+pi]/r[IDX.deaths+pi]);
    const wins = rows.map(r=>r[IDX.won+pi]);
    return {
      adr:     adrs.length ? adrs.reduce((a,b)=>a+b,0)/adrs.length : 0,
      kd:      kds.reduce((a,b)=>a+b,0)/kds.length,
      winrate: wins.reduce((a,b)=>a+b,0)/wins.length,
      maps:    rows.length
    };
  });
});

// For each map, rank players by (adr*0.4 + kd*30*0.4 + winrate*100*0.2)
function score(s) { return s.adr*0.4 + s.kd*30*0.35 + s.winrate*100*0.25; }

// Recommend: best 2-player team (highest combined score), remaining 2 opponents
function bestTeam(map) {
  const stats = mapStats[map];
  if (!stats || stats.some(s=>!s)) return null;
  let bestScore = -1, bestPair = null;
  for (let i=0;i<4;i++) for (let j=i+1;j<4;j++) {
    const s = score(stats[i]) + score(stats[j]);
    if (s > bestScore) { bestScore = s; bestPair = [i,j]; }
  }
  const opp = [0,1,2,3].filter(i=>!bestPair.includes(i));
  return { best: bestPair.map(i=>PLAYERS[i]), opp: opp.map(i=>PLAYERS[i]),
           stats: bestPair.map(i=>stats[i]), oppStats: opp.map(i=>stats[i]) };
}

// Balance tier
function balanceTier(diff) {
  if (diff <= 2)  return { label:'🟢 Near-perfect', color:'#3fb950' };
  if (diff <= 7)  return { label:'🟡 Good',         color:'#d29922' };
  if (diff <= 12) return { label:'🟠 Moderate',     color:'#f0883e' };
  return                  { label:'🔴 Lopsided',    color:'#f85149' };
}

// ─── TEAM COMPOSITION ────────────────────────────────────────────────────────
// MATE[i] = teammate of Orh+ on RAW row i (K=Kabooooom, M=MrFancyPants, S=SilentOat)
const MATE = 'KSKKSMKKSSSKSSSSSMSSKMSKSMMKMSSKMMMMSKSKKKSKMSKSKKMMKSKMMMKKSKKKMSMMMMSKMSMSMMKSSSMKKMKKSKSMSSMKKSMKSSSMKMSKSSKMSKSKMKSKSMMKSSSKMKKSKMMSSKMSSKSSSSMKKMSMKKKSSKMSMMMMSMSMSMKKMMSKKMSSMMMSKKSMK';
const MATE_IDX = { K:1, M:2, S:3 };
function teamsOf(i) {
  let m = MATE_IDX[MATE[i]];
  if (m === undefined) { // fallback for future rows: derive from won flags (non-tie only)
    const w0 = RAW[i][IDX.won];
    m = [1,2,3].find(pi => RAW[i][IDX.won+pi] === w0);
  }
  return [[0, m], [1,2,3].filter(x => x !== m)];
}
const chipOf = n => `<span class="player-chip ${CHIPS[n]}">${n}</span>`;
const TT = { backgroundColor:'#1c2128', borderColor:'#30363d', borderWidth:1, titleColor:'#e6edf3', bodyColor:'#c9d1d9' };

function mkBar(id, labels, data, colors, {fmt=v=>v, min, max}={}) {
  const ctx = document.getElementById(id).getContext('2d');
  const c = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: colors.map(c=>c+'40'), borderColor: colors, borderWidth: 2, borderRadius: 6 }] },
    options: {
      indexAxis: 'y', responsive: true,
      plugins: { legend: {display:false}, tooltip: { ...TT, callbacks: { label: c => ` ${fmt(c.parsed.x)}` } } },
      scales: {
        x: { grid:{color:GC}, ticks:{color:TC,font:{size:11}}, ...(min!=null?{min}:{}), ...(max!=null?{max}:{}) },
        y: { grid:{display:false}, ticks:{color:TC,font:{size:11}} }
      }
    }
  });
  allCharts[id] = c;
  return c;
}

function buildDuos() {

  RAW.forEach((r, i) => {
    teamsOf(i).forEach(team => {

      const d = duo[key] ??= { n:0, w:0, l:0, t:0, adrsum:0, adrn:0 };
      d.n++;
      const won = r[IDX.won + team[0]];
      if (won === 0.5) d.t++; else if (won === 1) d.w++; else d.l++;
      team.forEach(pi => { const a = r[IDX.adr+pi]; if (a !== null) { d.adrsum += a; d.adrn++; } });
    });
  });
  const entries = Object.entries(duo).map(([key, d]) => {
    const [a, b] = key.split('-').map(Number);
    return { names:[PLAYERS[a], PLAYERS[b]], colA: COLORS[PLAYERS[a]], ...d,
             wr: (d.w + 0.5*d.t) / d.n, adr: d.adrsum / d.adrn };

    html += `

}

// ─── RIVALRIES TAB ───────────────────────────────────────────────────────────
function buildRivals() {
  const h2h = {}; // key 'a-b' (a<b): w = a's wins over b
  RAW.forEach((r, i) => {
    const [t1, t2] = teamsOf(i);
    t1.forEach(a => t2.forEach(b => {
      const [x, y] = a < b ? [a, b] : [b, a];
      const d = h2h[`${x}-${y}`] ??= { w:0, l:0, t:0, n:0 };
      d.n++;
      const wx = r[IDX.won + x];
      if (wx === 0.5) d.t++; else if (wx === 1) d.w++; else d.l++;
    }));
  });
  const rec = (a, b) => { // record of a vs b
    const [x, y] = a < b ? [a, b] : [b, a];
    const d = h2h[`${x}-${y}`];
    return a < b ? d : { w:d.l, l:d.w, t:d.t, n:d.n };
  };
  const pairs = Object.keys(h2h).map(k => {
    const [a, b] = k.split('-').map(Number);
    const d = h2h[k];
    const wr = (d.w + 0.5*d.t) / d.n;
    return { a, b, ...d, wr, edge: Math.abs(wr - 0.5) };
  });
  const dominant = [...pairs].sort((x,y)=>y.edge-x.edge)[0];
  const closest  = [...pairs].sort((x,y)=>x.edge-y.edge)[0];
  const domWinner = dominant.wr >= 0.5 ? [dominant.a, dominant.b] : [dominant.b, dominant.a];

  let matrix = `<table class="h2h-table"><tr><th></th>${PLAYERS.map(p=>`<th style="color:${COLORS[p]}">vs ${p}</th>`).join('')}</tr>`;
  PLAYERS.forEach((rp, ri) => {
    matrix += `<tr><th style="color:${COLORS[rp]};text-align:right">${rp}</th>`;
    PLAYERS.forEach((cp, ci) => {
      if (ri === ci) { matrix += `<td style="color:var(--border)">—</td>`; return; }
      const d = rec(ri, ci);
      const wr = (d.w + 0.5*d.t) / d.n;
      const col = wr > 0.52 ? 'var(--green)' : wr < 0.48 ? 'var(--red)' : 'var(--yellow)';
      matrix += `<td><div class="h2h-pct" style="color:${col}">${(wr*100).toFixed(0)}%</div><div class="h2h-rec">${d.w}–${d.l}–${d.t}</div></td>`;
    });
    matrix += `</tr>`;
  });
  matrix += `</table>`;

  const container = document.getElementById('tab-rivals');
  let html = `
    <div class="rec-header">⚔️ Head-to-Head Rivalries</div>
    <p class="rec-sub">When two players are on <strong>opposite</strong> teams — who ends up winning? Read rows: the row player's win rate against the column player.</p>
    <div class="insight-banner">
      <h3>🥊 Rivalry Report</h3>
      <p><strong>Most one-sided: ${PLAYERS[domWinner[0]]}</strong> owns <strong>${PLAYERS[domWinner[1]]}</strong> — ${(Math.max(dominant.wr,1-dominant.wr)*100).toFixed(1)}% win rate across ${dominant.n} maps.<br>
      <strong>Closest rivalry: ${PLAYERS[closest.a]} vs ${PLAYERS[closest.b]}</strong> — ${(closest.wr*100).toFixed(1)}% / ${((1-closest.wr)*100).toFixed(1)}% over ${closest.n} maps. Dead even.</p>
    </div>
    <div class="chart-card full" style="margin-bottom:14px">
      <div class="card-title">⚔️ Head-to-Head Matrix (row beats column)</div>
      ${matrix}
    </div>
    <div class="map-grid">`;
  [...pairs].sort((x,y)=>y.edge-x.edge).forEach(p => {
    const lead = p.wr >= 0.5 ? [p.a, p.b, p.w, p.l] : [p.b, p.a, p.l, p.w];
    const wr = Math.max(p.wr, 1-p.wr);
    html += `
      <div class="map-card">
        <div class="team-players" style="margin-bottom:10px">${chipOf(PLAYERS[lead[0]])}<span style="font-size:10px;font-weight:700;color:var(--muted);align-self:center">leads</span>${chipOf(PLAYERS[lead[1]])}</div>
        <div style="font-size:24px;font-weight:800;color:${COLORS[PLAYERS[lead[0]]]}">${(wr*100).toFixed(1)}%</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">${lead[2]}–${lead[3]}–${p.t} · ${p.n} maps opposed</div>
      </div>`;
  });
  html += `</div>`;
  container.innerHTML = html;
}

// ─── FORM TAB ────────────────────────────────────────────────────────────────
function buildForm() {
  const avg = arr => { const v = arr.filter(x => x !== null && !isNaN(x)); return v.reduce((a,b)=>a+b,0)/v.length; };
  const base = PLAYERS.map((_, pi) => ({
    adr:   avg(sessData.adr.map(s => s[pi])),
    score: avg(sessData.score.map(s => s[pi]))
  }));
  // Form index: 100 = player's own average level (blend of ADR and scoreboard score)
  const form = SESSIONS.map((_, si) => PLAYERS.map((_, pi) => {
    const a = sessData.adr[si][pi], sc = sessData.score[si][pi];
    if (a === null || sc === null) return null;
    return 100 * (0.5 * a / base[pi].adr + 0.5 * sc / base[pi].score);
  }));
  const container = document.getElementById('tab-form');
  let cards = '';
  PLAYERS.forEach((name, pi) => {
    const vals = form.map(s => s[pi]).filter(v => v !== null);
    const last3 = vals.slice(-3);
    const cur = last3.reduce((a,b)=>a+b,0)/last3.length;
    let streak = 0, dir = 0;
    for (let si = form.length-1; si >= 0; si--) {
      const f = form[si][pi]; if (f === null) continue;
      const d = f >= 100 ? 1 : -1;
      if (dir === 0) dir = d;
      if (d === dir) streak++; else break;
    }
    const up = cur >= 100;
    cards += `
      <div class="stat-card">
        <div class="pname" style="color:${COLORS[name]}">${name}</div>
        <div class="big-val ${up?'delta-up':'delta-dn'}">${up?'▲':'▼'} ${cur.toFixed(0)}</div>
        <div class="sub">${dir>0?'🔥 hot':'🧊 cold'} streak: ${streak} session${streak===1?'':'s'} ${dir>0?'above':'below'} their average</div>
      </div>`;
  });
  container.innerHTML = `
    <div class="rec-header">🔥 Form Tracker</div>
    <p class="rec-sub">Form index per session: 100 = that player's own long-run average (50% ADR + 50% scoreboard score). Above 100 = playing better than usual. Cards show last-3-session form.</p>
    <div class="stat-row">${cards}</div>
    <div class="chart-grid">
      <div class="chart-card">
        <div class="card-title">📈 Form Index by Session</div>
        <canvas id="form-main" height="240"></canvas>
        <div class="legend" id="form-legend"></div>
      </div>
      <div class="chart-card">
        <div class="card-title">🌊 Rolling 3-Session Form</div>
        <canvas id="form-smooth" height="240"></canvas>
      </div>
    </div>`;
  setTimeout(() => {
    mkChart('form-main', mkDatasets(form), {min:40, max:170, label:'Form (100 = personal avg)', yFmt:v=>v.toFixed(0)});
    mkLegend('form-legend', 'form-main');
    mkChart('form-smooth', mkSmoothDatasets(form), {min:60, max:150, yFmt:v=>v.toFixed(0)});
  }, 0);
}
buildForm();

// ─── TAB SWITCHING ──────────────────────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    const ids = ['adr','kills','deaths','kd','assists','score','winrate','duos','rivals','form','recs'];
    t.classList.toggle('active', ids[i] === id);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  // resize charts to fix rendering in hidden tabs
  Object.values(allCharts).forEach(c => c.resize());
}
</script>
</body>
